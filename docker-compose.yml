services:
  # 로컬 개발용 DB
  postgres-dev:
    image: postgres:16-alpine
    container_name: mople-postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=mople
      - POSTGRES_PASSWORD=mople1234
      - POSTGRES_DB=mople_db

  # 로컬 테스트용 DB
  postgres-test:
    image: postgres:16-alpine
    container_name: mople-postgres-test
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=mople
      - POSTGRES_PASSWORD=mople1234
      - POSTGRES_DB=mople_db

  # 로컬 개발 및 테스트용 Redis
  redis:
    image: redis:7-alpine
    container_name: mople-redis
    ports:
      - "127.0.0.1:6380:6379"

  broker:
    image: apache/kafka:3.9.0
    hostname: broker
    container_name: mople-kafka
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1 # 브로커 식별 ID

      # PLAINTEXT : Docker 내부 통신 프로토콜, PLAINTEXT_HOST : 호스트 통신 프로토콜, CONTROLLER : KRaft Controller 통신 프로토콜
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT, PLAINTEXT_HOST:PLAINTEXT, CONTROLLER:PLAINTEXT

      # PLAINTEXT : Docker 내부에서 접근할 주소, PLAINTEXT_HOST : localhost에서 접근할 주소
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092, PLAINTEXT_HOST://localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # Consumer offset Topic 복제 수
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0 # Consumer 그룹이 처음 생성될 때 리밸런스(Consumer 작업 정렬) 기다리는 시간
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1 # Transaction 로그의 최소 동기화 Replica 수
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1 # Transaction 로그 복제 수
      KAFKA_PROCESS_ROLES: broker,controller # Broker, KRaft Controller 역할 수행
      KAFKA_NODE_ID: 1 # KRaft 노드 식별 ID
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093 # kafka controller quorum에 참여하는 노드 정보

      # PLAINTEXT : Docker 내부에서 수신, PLAINTEXT_HOST : localhost에서 수신, CONTROLLER : KRaft Controller 통신
      KAFKA_LISTENERS: PLAINTEXT://broker:29092, PLAINTEXT_HOST://0.0.0.0:9092, CONTROLLER://broker:29093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT # Broker간 통신에 사용할 Listener
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER # Controller 통신에 사용할 Listener
      KAFKA_LOG_DIRS: /var/lib/kafka/data # Kafka 데이터 저장 경로
      CLUSTER_ID: MkU30EVBNTcwNTJENDM2Qk # Kafka 클러스터 식별 ID

    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  kafka-data:
