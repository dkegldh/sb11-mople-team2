# 이 nginx는 실제 배포에는 안 쓰이고, 로컬 부하테스트 전용이다.
# 그래서 로컬 컨테이너 이름을 upstream{}에 직접 고정해서 진짜 라운드로빈 +
# max_fails/fail_timeout 을 쓴다
upstream app_server {
    server mople-load-test-app-test-1:8080 max_fails=3 fail_timeout=5s;
    server mople-load-test-app-test-2:8080 max_fails=3 fail_timeout=5s;
    server mople-load-test-app-test-3:8080 max_fails=3 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;

    # 일반 API 요청
    location / {
        proxy_pass http://app_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 로컬 확인용: 실제로 어느 백엔드가 처리했는지 브라우저 개발자도구에서 볼 수 있게 노출
        add_header X-Upstream-Addr $upstream_addr always;
    }

    # WebSocket (STOMP + SockJS) - WebSocketConfig의 /ws 엔드포인트
    location /ws {
        proxy_pass http://app_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # SSE - SseController의 /api/sse 엔드포인트
    location /api/sse {
        proxy_pass http://app_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }
}
