spring:
  datasource:
    url: jdbc:h2:mem:mople-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  kafka:
    bootstrap-servers: localhost:9093
    topics:
      follow-created: mople.follow.created.v1
      playlist-content-added: mople.playlist.content-added.v1
      direct-message-created: mople.direct-message.created.v1
      notification-created: mople.notification.created.v1
    enabled: false

  data:
    redis:
      host: localhost
      port: 6380
      # 커맨드 타임아웃, 이게 없으면 응답 없는 Redis에 요청 스레드가 묶임
      timeout: 2s
      connect-timeout: 1s

  elasticsearch:
    uris: http://localhost:19201

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: email, profile
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  mail:
    host: localhost
    port: 3025

jwt:
  secret: test-secret-key-for-ci-pipeline-only-1234567890

admin:
  password: "Test1234!"

external-api:
  tmdb:
    base-url: http://localhost:0
    api-key: test-key
  sportsdb:
    base-url: http://localhost:0
    api-key: test-key

redis:
  # 캐시 키와 락 키, 환경이 섞이지 않게 프로파일마다 문자열로 박아둠
  namespace: mople:test

batch:
  tmdb:
    collect:
      cron: "-"
      enabled: false

oauth2:
  redirect:
    success-uri: http://localhost:3000/
    failure-uri: http://localhost:3000/login

app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
  websocket:
    allowed-origins:
      - "http://localhost:5173"

sse:
  stream-consumer:
    enabled: false
  server-id: test-server-id