spring:
  datasource:
    url: jdbc:h2:mem:mople-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: email, profile
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: test-secret-key-for-ci-pipeline-only-1234567890

admin:
  password: "Test1234!"

external-api:
  tmdb:
    base-url: http://localhost:0
    api-key: test-key
  sportsdb:
    base-url: http://localhost:0
    api-key: test-key

batch:
  tmdb:
    collect:
      cron: "-"
      enabled: false

oauth2:
  redirect:
    success-uri: http://localhost:3000/
    failure-uri: http://localhost:3000/login
