spring:
  datasource:
    url: jdbc:postgresql://postgres-test:5432/mople_db
    username: mople
    password: mople1234

  data:
    redis:
      host: redis-test
      port: 6379
      # 커맨드 타임아웃, 이게 없으면 응답 없는 Redis에 요청 스레드가 묶임
      timeout: 2s
      connect-timeout: 1s

  elasticsearch:
    uris: http://elasticsearch-test:9200

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

  kafka:
    bootstrap-servers: broker-test:29092
    enabled: true

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_USERNAME:}
    password: ${BREVO_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

logging:
  level:
    com.codeit.mople: INFO

jwt:
  secret: local-dev-secret-key-change-this-1234567890

cookie:
  secure: false

password-reset:
  enabled: false
  rate-limit:
    global:
      max-requests: 200
      window-minutes: 1440

admin:
  email: "admin@mople.com"
  password: "Admin1234!"
  name: "관리자"

external-api:
  tmdb:
    base-url: https://api.themoviedb.org/3
    api-key: ${TMDB_API_KEY:}
    image-base-url: https://image.tmdb.org/t/p/w500
  sportsdb:
    base-url: https://www.thesportsdb.com/api/v1/json
    api-key: ${SPORTSDB_API_KEY:3}

redis:
  # 캐시 키와 락 키, 환경이 섞이지 않게 프로파일마다 문자열로 박아둠
  namespace: mople:test

batch:
  tmdb:
    collect:
      cron: "-"
      enabled: false

oauth2:
  redirect:
    success-uri: http://localhost:8080/
    failure-uri: http://localhost:8080/

app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:8080"

  websocket:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:8080"

sse:
  server-id: "test"
  stream-consumer:
    enabled: false