spring:
  application:
    name: mople
  profiles:
    active: dev

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  access-token-expiration: 1800000     # 30분 (ms)
  refresh-token-expiration: 604800000  # 7일 (ms)

password-reset:
  expiration-minutes: 3

admin:
  email: "admin@mople.com"
  password: ${ADMIN_PASSWORD}
  name: "관리자"