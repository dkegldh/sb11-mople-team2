name: mople-load-test
# 실행: docker compose -f docker-compose-test.yml up -d
services:
  # 부하 테스트 대상 Spring Boot 애플리케이션.
  # nginx.conf.template이 mople-load-test-app-test-1/2/3 컨테이너 이름을 직접 참조하므로
  # 항상 3대여야 함 (Compose V2는 스웜 모드가 아니어도 deploy.replicas를 인식함).
  # container_name/ports를 안 쓰는 이유: 둘 다 고정값이면 3대로 못 띄움("포트 중복"/
  # "컨테이너 이름 중복" 에러). container_name을 안 정하면 컴포즈가
  # mople-load-test-app-test-1/2/3 형태로 자동 생성하는데, nginx.conf가 참조하는 이름이
  # 바로 이거임. nginx와 app-test가 같은 도커 네트워크 안에서 컨테이너 이름으로 8080 포트에
  # 직접 붙기 때문에 호스트에 포트 노출은 불필요(k6 등 외부에서는 nginx의 8081로 접근).
  app-test:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    environment:
      SPRING_PROFILES_ACTIVE: load
      TMDB_API_KEY: ${TMDB_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      # ElasticsearchConfig가 필수로 요구하는데, elasticsearch-test는 보안 비활성화라 빈 값으로 충분
      ELASTIC_PASSWORD: ""
    # SSE_SERVER_ID를 컨테이너마다 다른 $HOSTNAME 기반으로 만들기 위한 트릭
    # (ECS 태스크 정의 ecs/task-def-app.json과 동일) - 3대로 스케일했을 때 SseService의
    # Redis 기반 서버 라우팅이 제대로 되는지 로컬에서 먼저 검증하기 위함.
    entrypoint: ["sh", "-c"]
    command:
      - "export SSE_SERVER_ID=\"app-$$HOSTNAME\" && exec java -XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError -jar app.jar"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_started
      broker-test:
        condition: service_started
      elasticsearch-test:
        condition: service_healthy

  # 부하 테스트용 PostgreSQL
  postgres-test:
    image: postgres:16-alpine
    container_name: mople-postgres-test
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: mople
      POSTGRES_PASSWORD: mople1234
      POSTGRES_DB: mople_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mople -d mople_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

  # 부하 테스트용 Redis
  redis-test:
    image: redis:7-alpine
    container_name: mople-redis-test
    ports:
      - "6381:6379"
    volumes:
      - redis-test-data:/data

  # 부하 테스트용 Kafka
  broker-test:
    image: apache/kafka:3.9.0
    hostname: broker-test
    container_name: mople-kafka-test
    ports:
      - "19093:9092"
    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-test:29092,PLAINTEXT_HOST://localhost:19093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker-test:29093

      KAFKA_LISTENERS: PLAINTEXT://broker-test:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://broker-test:29093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU30EVBNTcwNTJENDM2Qk
    volumes:
      - kafka-test-data:/var/lib/kafka/data

  # 부하 테스트용 Elasticsearch
  elasticsearch-test:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    container_name: mople-elasticsearch-test
    ports:
      - "19200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - elasticsearch-test-data:/usr/share/elasticsearch/data

  # 로컬 부하테스트 전용 nginx 리버스 프록시 (실제 배포는 ALB로 대체 예정).
  # app-test의 deploy.replicas: 3 설정에 의해 항상 3대가 뜨는 것을 전제로 라운드로빈 구성.
  nginx:
    image: nginx:1.27-alpine
    container_name: mople-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-test

volumes:
  postgres-test-data:
  redis-test-data:
  kafka-test-data:
  elasticsearch-test-data: